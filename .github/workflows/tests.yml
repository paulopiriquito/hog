name: tests
on:
  pull_request:
  push:
    branches: [master, v2]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt vet
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: make test race
      - run: cd plugins/statestore-valkey && go mod tidy && git diff --exit-code go.mod go.sum
      - run: make plugins-test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # ubuntu-latest ships google-chrome, which chromedp uses; Docker is preinstalled.
      # Since the 2026-10-18 ubuntu-24.04 runner image, AppArmor's restriction
      # on unprivileged user namespaces reaches that Chrome, which then aborts
      # at startup with "No usable sandbox". Lifting the restriction for the
      # job keeps Chrome's own sandbox in place, which --no-sandbox would not.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make e2e
